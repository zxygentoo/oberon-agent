[package]
name = "oat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "oberon-agent-tool — stateless CLI for driving AgentTool.Mod on a live Project Oberon or Extended Oberon system."

[[bin]]
name = "oat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
