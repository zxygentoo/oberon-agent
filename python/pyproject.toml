[project]
name = "pucxy"
version = "0.0.1"
description = "Host-side proxy bridging Project Oberon's serial line to an LLM (the puck coding agent)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dotenv = ["python-dotenv"]

[project.scripts]
pucxy = "pucxy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pucxy"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
